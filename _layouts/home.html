---
layout: default
---
<div class="grid-2">
  <section aria-labelledby="about">
    <p class="kicker">01 &mdash; about</p>
    <h2 id="about">Welcome!</h2>
    <div class="prose">
      {{ content }}
    </div>
  </section>

  <section aria-labelledby="news">
    <p class="kicker">02 &mdash; latest</p>
    <h2 id="news">News</h2>
    <ul class="toc toc-stack">
      {%- assign news = site.data.news | sort: 'date' | reverse %}
      {%- for n in news %}
      {% include toc-item.html item=n meta=n.label detail=n.detail %}
      {%- endfor %}
    </ul>
  </section>
</div>
