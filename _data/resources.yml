# Sections on /resources. `blurb` and `note` accept Markdown.

- id: ai
  title: "AI-Related Stuff"
  blurb: "AI is here to stay (and might take our jobs). May the force be with us."
  items:
    - name: "Intro to Claude Code for Academics"
      url: "https://github.com/aspi6246/Claude-Code-Presentation/blob/main/Presentations/main.pdf"
      note: "I personally lean Codex, but the concepts translate back and forth."
    - name: "Claude Code Workflow by Pedro Sant'Anna"
      url: "https://psantanna.com/claude-code-my-workflow/workflow-guide.html"
      note: "great if you're new to `skills` and agents."
    - name: "VS Code Live: Agent Sessions"
      url: "https://www.youtube.com/playlist?list=PLj6YeMhvp2S4gpM0lGDd5hIDveC7IsLwv"
      note: "the VS Code team on customizing agents. I'm a BIG fan of VS Code and Copilot."
    - name: "Awesome Copilot"
      url: "https://github.com/github/awesome-copilot"
      note: "community prompts and agents for customizing Copilot."

- id: terminal
  title: "Life in the Fast (Terminal) Lane"
  blurb: "Back at Northwestern, [Bob McDonald](https://www.kellogg.northwestern.edu/academics-research/faculty/mcdonald_robert/) once told me *\"I live in the Terminal!\"*. Sounded cool, so I try to keep up. Tools that make the ride smoother:"
  items:
    - name: "tmux"
      url: "https://github.com/tmux/tmux"
      note: "keeps sessions, windows, and panes alive so one closed window doesn't ruin your day. I live between office and home on a remote server, so this is essential."
    - name: "Starship"
      url: "https://starship.rs/"
      note: "a fast, customizable prompt that warns you before you run the wrong command in the wrong folder. Great `conda` support too."
    - name: "Oh My Zsh"
      url: "https://ohmyz.sh/"
      note: "themes, plugins, autocomplete. The terminal can have nice things too."
    - name: "Homebrew"
      url: "https://brew.sh/"
      note: "the package manager you'll want five minutes after setting up a Mac."
    - name: "Ghostty"
      url: "https://ghostty.org/"
      note: "fast, polished, native terminal emulator. A millionaire's passion project -- expect great stuff."
    - name: "Glow"
      url: "https://github.com/charmbracelet/glow"
      note: "a terminal Markdown reader. Fast and nice, and Markdown is the language of AI now."

- id: coding
  title: "Coding Like The Old Days"
  blurb: "I like writing code, and do it better every day (less true since agents took over...). Some general principles apply across the board, IMHO."
  items:
    - name: "Classes by Jesus Fernandez-Villaverde"
      url: "https://www.sas.upenn.edu/~jesusfv/teaching.html"
      note: "see *Computational Methods for Economists*. Useful even if you don't do Macro."
    - name: "The Missing Semester of Your Computer Science Education"
      url: "https://missing.csail.mit.edu/"
      note: "MIT lectures on terminals, version control, editors -- useful regardless of field. I revisit this from time to time."
    - name: "Combining DropBox or GitHub"
      url: "https://github.com/kbjarkefur/GitHubDropBox"
      note: "a tutorial for the tricky bit of pairing Git/GitHub with DropBox (or Drive, Box, etc.) for large files."
    - name: "Data Science for Economists"
      url: "https://github.com/uo-ec607"
      note: "Grant McDermott's (Oregon) class on terminal and Git basics. R-centric but mostly language-agnostic."
    - name: "Python and R Guides by Sean Higgins"
      url: "https://github.com/skhiggins"
      note: "Sean (Kellogg) on empirical methods and managing large collaborative projects, in Python, R, and Stata."
    - name: "Code and Data, by Matthew Gentzkow and Jesse Shapiro"
      url: "https://shapiro.scholars.harvard.edu/sites/g/files/omnuum7731/files/shapiro/files/codeanddata.pdf"
      note: "older but timeless. [Brandon Zborowski](https://www.brandonzborowski.com/) says it's mandatory reading at the NY Fed's RA program and in Econ consulting."
    - name: "The Good Research Code Handbook, by Patrick Mineault"
      url: "https://goodresearch.dev/"
      note: "organizing projects, documentation, modules. Python-centric, but great regardless. Thanks to [Nate Lawrence](https://www.nathaniellawrence.com/) for the pointer!"

- id: data
  title: "Data Resources"
  blurb: "Sometimes finding data is hard. Remember to correctly cite the providers if you use their data."
  items:
    - name: "Open Source Asset Pricing"
      url: "https://www.openassetpricing.com/"
      note: "300+ monthly \"anomaly\" factor series, with a companion [paper](https://www.nowpublishers.com/article/Details/CFR-0112)."
    - name: "Saketh Aleti's High Frequency Data"
      url: "https://www.sakethaleti.com/data"
      note: "free 1-minute returns for Asset Pricing factors. Saketh's a great guy, though this doesn't look actively updated anymore."
    - name: "NEFIN @ USP"
      url: "https://nefin.com.br/"
      note: "a Finance research center at USP computing indicators for the Brazilian market, including the Fama-French 5 factors."

- id: stats-ml
  title: "Statistical Methods in Finance and Economics"
  blurb: "Material at the intersection of Machine Learning and Economics/Finance."
  items:
    - name: "A Similar Page by Dario Sansone"
      url: "https://sites.google.com/view/dariosansone/resources/machine-learning"
      note: "Dario (Exeter) curates papers and classes on ML, mostly through an Econ lens. Super detailed."
    - name: "Financial Machine Learning"
      url: "https://www.nber.org/system/files/working_papers/w31502/w31502.pdf"
      note: "Kelly and Xiu's review, focused on *prediction*. See Fernandez-Villaverde above for the \"ML to solve models\" angle instead."
    - name: "Deep Learning for Economists"
      url: "https://www.aeaweb.org/articles?id=10.1257/jel.20241733"
      note: "Melissa Dell's great intro -- a good place to start. More of her teaching at [EconDL](https://econdl.github.io/)."
