{%- assign cur = page.url | remove: '.html' -%}
{%- if cur == '/index' -%}{%- assign cur = '/' -%}{%- endif -%}
<header class="paper">
  <div class="wrap">
    <div class="bar">
      <a class="path" href="{{ '/' | relative_url }}">~/rgriva{% if page.cwd %}<span>/{{ page.cwd }}</span>{% endif %}</a>
      <nav class="nav-mono" aria-label="Site">
        {%- for item in site.data.settings.menu %}
        <a href="{{ item.url | relative_url }}"{% if cur == item.url %} aria-current="page"{% endif %}>{{ item.name | downcase }}</a>
        {%- endfor %}
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
        <span data-theme-label>Dark mode</span>
      </button>
    </div>
    {% include hero.html %}
  </div>
</header>
