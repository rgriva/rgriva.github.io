<header class="d-flex flex-column flex-lg-row align-items-center pb-3 mb-5 border-bottom">
  <div class="header-brand">
    <a href="{{ site.github.url }}/" class="d-flex align-items-center text-decoration-none">
      <span class="fs-1 fw-bold">{{ site.title }}</span>
    </a>
    <a href="{{ site.github.url }}/" class="d-flex align-items-center text-decoration-none">
      <span>{{ site.description }}</span>
    </a>
  </div>
  <div class="header-controls d-flex flex-column flex-lg-row align-items-center mt-2 mt-lg-0 ms-lg-auto">
    <nav class="d-inline-flex">
      {% for item in site.data.settings.menu %}
        <a class="py-2 text-decoration-none" href="{{ site.github.url }}{{ item.url }}">{{ item.name }}</a>
      {% endfor %}
    </nav>
    <button id="theme-toggle" type="button" class="theme-toggle-btn ms-lg-4" aria-pressed="false" aria-label="Switch to dark mode">
      <i class="fas fa-moon theme-toggle-icon" aria-hidden="true"></i>
      <span class="theme-toggle-label">Dark mode</span>
    </button>
  </div>
</header>
